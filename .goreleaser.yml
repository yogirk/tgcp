version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/tgcp
    binary: tgcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - format: tar.gz
    name_template: "tgcp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

brews:
  - repository:
      owner: yogirk
      name: homebrew-tgcp
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: "."
    name: tgcp
    homepage: "https://github.com/yogirk/tgcp"
    description: "Terminal UI for Google Cloud Platform"
    license: "MIT"
    test: |
      system "#{bin}/tgcp", "--version"
